scenario:
  name: fear_hri_brick_carry
  description: >
    Person on sim_human_0 patrols near the robot work area.
    Use with sim.launch.py mode:=truth_twin.
  actors:
    - id: 1
      name: exercising_person
      kind: human
      body_name: sim_human_0
      is_subject: true
      visible_to_lidar: true
      pose:
        x: 1.25
        y: -0.75
        z: 0.0
        yaw: 1.5707963267948966
      motion:
        mode: patrol
        speed: 0.30
        loop: true
        start_delay: 2.0
        waypoints:
          - {x: 1.25, y: -0.75, z: 0.0}
          - {x: 0.90, y: 0.20, z: 0.0}
          - {x: 1.25, y: 0.75, z: 0.0}
          - {x: 1.60, y: 0.20, z: 0.0}
